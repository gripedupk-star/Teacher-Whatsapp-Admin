name: Build EWA Android Admin APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Check project
        working-directory: android-admin
        run: |
          echo "Project files:"
          ls -la
          echo ""
          echo "Gradle version:"
          gradle --version

      - name: Build Debug APK
        working-directory: android-admin
        run: |
          gradle clean assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "Generated APK files:"
          find android-admin/app/build/outputs -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ewa-android-admin-debug
          path: android-admin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
